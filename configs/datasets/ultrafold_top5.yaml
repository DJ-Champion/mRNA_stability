# configs/datasets/ultrafold_top5.yaml
# The five shortest ultrafolded transcripts (mRNA z < -30): GEMIN6, ZNF713,
# GATD1, VHL, ZNF101. Same genome, annotation and isoform rules as human_all so
# each gene resolves to the same transcript; only mRNA is extracted (all that
# the rnafold_shuffles tool needs). Verify after 01_extract:
#   grep -E 'ENST00000(281950.8|429591.4|319863.13|256474.3|592502.2)' \
#       runs/ultrafold_top5/extracted_regions/manifest.tsv   # expect 5 rows

inputs:
  genome_fasta: data/human/GRCh38.primary_assembly.genome.fa
  annotation_gff: data/human/MANE.GRCh38.v1.5.ensembl_genomic.gff
  gene_list: data/human/gene_ids_ultrafold_top5.txt

extraction:
  min_utr_length: 30
  filter_short_utrs: false
  codon_flank_length: 30
  tail_length: 100
  output_mode: multifasta
  isoform_priority:
    - "appris_principal_1"
    - "appris_principal_2"
    - "appris_principal_3"
    - "Ensembl_canonical"
    - "MANE_Select"
  regions_to_extract:
    - mRNA

species: human
