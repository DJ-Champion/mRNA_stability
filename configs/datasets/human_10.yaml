# configs/datasets/human_10.yaml
# 10 randomly chosen human genes, for timing / smoke-testing tools/rnaup_avoidance
# on the cluster before the full run (RNAUP_AVOIDANCE.md). Same genome, annotation and
# isoform rules as human_all, so each gene resolves to the same transcript.
# Only the start-codon window (start_codon_pm30) is extracted; it is the only one scored.
# gene_list: one Ensembl gene ID per line (see data/human/gene_ids_ultrafold_shuffle_set.txt).

inputs:
  genome_fasta: data/human/GRCh38.primary_assembly.genome.fa
  annotation_gff: data/human/MANE.GRCh38.v1.5.ensembl_genomic.gff
  gene_list: data/human/gene_ids_human_10.txt

extraction:
  min_utr_length: 30
  filter_short_utrs: false
  codon_flank_length: 30            # start_codon_pm30 needs 30
  output_mode: multifasta
  isoform_priority:
    - "appris_principal_1"
    - "appris_principal_2"
    - "appris_principal_3"
    - "Ensembl_canonical"
    - "MANE_Select"
  regions_to_extract:
    - start_codon_region

species: human
